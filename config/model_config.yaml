# Model Configuration for F1 Race Prediction

# XGBoost Hyperparameters
xgboost:
  objective: 'reg:squarederror'
  max_depth: 8
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42

# Neural Network Hyperparameters
neural_network:
  hidden_dims: [256, 128, 64]
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  early_stopping_patience: 10
  dropout: 0.2

# Training Configuration
training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  cross_validation_folds: 5

# Feature Engineering
features:
  # Basic features
  include_lap_progress: true
  include_stint_features: true
  include_tire_age: true
  
  # Weather features
  include_weather: true
  weather_window_laps: 5
  
  # Tire features
  tire_degradation_model: 'compound_specific'
  include_tire_warmup: true
  
  # Fuel features
  fuel_weight_per_lap_kg: 1.6
  fuel_time_penalty_per_kg: 0.035
  
  # Track evolution
  track_evolution_rate: 0.002  # seconds per lap

# Model Selection
model_selection:
  default_model: 'xgboost'  # 'xgboost', 'neural_network', 'ensemble'
  ensemble_weights:
    xgboost: 0.6
    neural_network: 0.4
